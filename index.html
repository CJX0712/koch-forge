<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KochForge · 科赫锻造炉</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --txt:#e6edf3;
    --muted:#8b949e; --accent:#58a6ff; --live:#3fb950; --dead:#0d1117;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;}
  .wrap{max-width:1040px;margin:0 auto;padding:20px;}
  h1{font-size:20px;margin:0 0 4px;letter-spacing:.5px;}
  h1 .v{color:var(--accent);}
  .sub{color:var(--muted);font-size:12px;margin-bottom:16px;}
  .layout{display:grid;grid-template-columns:1fr 280px;gap:16px;}
  @media(max-width:820px){.layout{grid-template-columns:1fr;}}
  .stage{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;}
  canvas{display:block;width:100%;height:auto;background:#05060a;border:1px solid var(--border);border-radius:4px;}
  .side{display:flex;flex-direction:column;gap:12px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;}
  .card h2{font-size:12px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;}
  button{background:#21262d;color:var(--txt);border:1px solid var(--border);border-radius:6px;
    padding:7px 10px;font-size:12px;cursor:pointer;font-family:inherit;}
  button:hover{border-color:var(--accent);}
  button.primary{background:var(--accent);color:#0d1117;border-color:var(--accent);font-weight:600;}
  input[type=text]{width:100%;background:#0d1117;color:var(--txt);border:1px solid var(--border);
    border-radius:6px;padding:7px 9px;font-size:12px;font-family:inherit;}
  label{font-size:11px;color:var(--muted);display:block;margin:8px 0 4px;}
  .stats{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px dashed var(--border);}
  .stats:last-child{border-bottom:none;}
  .stats b{color:var(--accent);}
  .self{font-size:11px;line-height:1.7;}
  .self .ok{color:var(--live);}
  .self .bad{color:#f85149;}
  .hint{font-size:11px;color:var(--muted);line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <h1>KochForge <span class="v">·</span> 科赫锻造炉</h1>
  <div class="sub">单文件离线科赫雪花分形 · 迭代细分 + Hausdorff 维 log4/log3 — <a href="https://github.com/CJX0712/koch-forge" style="color:var(--accent)">github.com/CJX0712/koch-forge</a></div>

  <div class="layout">
    <div class="stage">
      <canvas id="cv" width="600" height="600"></canvas>
      <label>迭代层数 <span id="iterLabel">3</span></label>
      <input id="iter" type="range" min="0" max="5" value="3">
    </div>

    <div class="side">
      <div class="card">
        <h2>状态</h2>
        <div class="stats"><span>迭代</span><b id="it">3</b></div>
        <div class="stats"><span>顶点数</span><b id="vtx">0</b></div>
        <div class="stats"><span>周长</span><b id="per">0</b></div>
        <div class="stats"><span>Hausdorff 维</span><b id="dim">1.2619</b></div>
      </div>

      <div class="card">
        <h2>随机变体（可选）</h2>
        <div style="display:flex;gap:6px;">
          <input id="seed" type="text" placeholder="留空=标准雪花" value="">
        </div>
        <div class="row" style="margin-top:8px;">
          <button id="applyseed">用种子生成变体</button>
          <button id="reset" class="warn">恢复标准</button>
        </div>
        <div class="hint" style="margin-top:6px;">标准科赫确定性生成；填种子则每条凸包随机向内外翻，生成专属混乱雪花（仍同种子可复现）。</div>
      </div>

      <div class="card">
        <h2>内置自检</h2>
        <div class="self" id="selfcheck">点击「运行自检」验证分形不变量。</div>
        <div class="row" style="margin-top:8px;">
          <button id="selftest">运行自检</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script id="engine">
// ===== KochForge engine (pure, headless-extractable) =====
const Koch = (function(){
  function sub(a, b){ return { x: a.x - b.x, y: a.y - b.y }; }
  function add(a, b){ return { x: a.x + b.x, y: a.y + b.y }; }
  function rotate(vx, vy, ang){
    const c = Math.cos(ang), s = Math.sin(ang);
    return { x: vx * c - vy * s, y: vx * s + vy * c };
  }

  // one Koch segment from a to b, subdivided n times; returns points (a .. excluding b)
  function kochSegment(a, b, n, rnd){
    if (n <= 0) return [a];
    const d = sub(b, a);
    const p = add(a, { x: d.x / 3, y: d.y / 3 });
    const q = add(a, { x: 2 * d.x / 3, y: 2 * d.y / 3 });
    const v = sub(p, q);
    let ang = Math.PI / 3; // outward peak (equilateral bump); CCW traversal -> left turn = outward
    if (rnd) ang = rnd() < 0.5 ? -Math.PI / 3 : Math.PI / 3;
    const rv = rotate(v.x, v.y, ang);
    const peak = add(q, rv);
    return [].concat(
      kochSegment(a, p, n - 1, rnd),
      kochSegment(p, peak, n - 1, rnd),
      kochSegment(peak, q, n - 1, rnd),
      kochSegment(q, b, n - 1, rnd)
    );
  }

  // Koch snowflake: equilateral triangle (circumradius=size) subdivided n times
  function kochSnowflake(n, size, seedStr){
    size = size || 200;
    let rnd = null;
    if (seedStr){
      let st = 0; const str = String(seedStr);
      for (let i = 0; i < str.length; i++) st = (st * 31 + str.charCodeAt(i)) >>> 0;
      st = st || 0x9e3779b9;
      rnd = () => { st = (st * 1664525 + 1013904223) >>> 0; return st / 4294967296; };
    }
    const verts = [];
    for (let i = 0; i < 3; i++){
      const a = i * 2 * Math.PI / 3 - Math.PI / 2;
      verts.push({ x: size * Math.cos(a), y: size * Math.sin(a) });
    }
    let pts = [];
    for (let i = 0; i < 3; i++){
      // each side's kochSegment excludes its terminal vertex (b), so no duplicate junctions:
      // side i-1 ends before verts[i], side i starts at verts[i] -> continuous, 3·4ⁿ distinct points.
      const seg = kochSegment(verts[i], verts[(i + 1) % 3], n, rnd);
      pts = pts.concat(seg);
    }
    return pts;
  }

  function perimeter(pts){
    let L = 0;
    for (let i = 0; i < pts.length; i++){
      const a = pts[i], b = pts[(i + 1) % pts.length];
      L += Math.hypot(a.x - b.x, a.y - b.y);
    }
    return L;
  }

  function hausdorffDim(){ return Math.log(4) / Math.log(3); }

  return { sub, add, rotate, kochSegment, kochSnowflake, perimeter, hausdorffDim };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = Koch;
</script>

<script>
// ===== UI =====
(function(){
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;

  function draw(){
    const n = +document.getElementById('iter').value;
    const seed = document.getElementById('seed').value.trim();
    const pts = Koch.kochSnowflake(n, 200, seed || undefined);
    // bbox
    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    for (const p of pts){ minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y); }
    const bw = maxX - minX, bh = maxY - minY;
    const scale = Math.min(W / bw, H / bh) * 0.92;
    const ox = (W - bw * scale) / 2 - minX * scale;
    const oy = (H - bh * scale) / 2 - minY * scale;
    ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#58a6ff'; ctx.lineWidth = 1; ctx.beginPath();
    for (let i = 0; i < pts.length; i++){
      const x = pts[i].x * scale + ox, y = pts[i].y * scale + oy;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.stroke();
    // stats
    const side0 = 200 * Math.sqrt(3); // initial circumradius 200 -> side length
    document.getElementById('it').textContent = n;
    document.getElementById('vtx').textContent = pts.length;
    document.getElementById('per').textContent = Koch.perimeter(pts).toFixed(1);
    document.getElementById('dim').textContent = Koch.hausdorffDim().toFixed(4);
    document.getElementById('iterLabel').textContent = n;
  }

  document.getElementById('iter').oninput = draw;
  document.getElementById('applyseed').onclick = draw;
  document.getElementById('reset').onclick = () => { document.getElementById('seed').value = ''; draw(); };

  document.getElementById('selftest').onclick = () => {
    const out = [];
    const T = (name, cond) => out.push((cond ? '<span class="ok">✓</span> ' : '<span class="bad">✗</span> ') + name);
    // vertex count = 3 * 4^n
    let vok = true;
    for (let n = 0; n <= 4; n++){ if (Koch.kochSnowflake(n, 200).length !== 3 * Math.pow(4, n)) vok = false; }
    T('顶点数 = 3·4ⁿ (n=0..4)', vok);
    // perimeter scales as (4/3)^n
    const side0 = 200 * Math.sqrt(3);
    let pok = true;
    for (let n = 0; n <= 4; n++){
      const per = Koch.perimeter(Koch.kochSnowflake(n, 200));
      const exp = 3 * side0 * Math.pow(4 / 3, n);
      if (Math.abs(per - exp) / exp > 1e-6) pok = false;
    }
    T('周长 = 3·√3·R·(4/3)ⁿ', pok);
    // hausdorff dimension
    T('Hausdorff 维 = log4/log3 ≈ 1.2619', Math.abs(Koch.hausdorffDim() - Math.log(4) / Math.log(3)) < 1e-12);
    // equilateral bump: |peak-p| == |p-q| at n>=1
    const a = { x: 0, y: 0 }, b = { x: 300, y: 0 };
    const seg = Koch.kochSegment(a, b, 1, null);
    const p1 = seg[0], p2 = seg[1], pk = seg[2], q1 = seg[3];
    const lp = Math.hypot(pk.x - p2.x, pk.y - p2.y);
    const lq = Math.hypot(p2.x - q1.x, p2.y - q1.y);
    T('凸包为等边 (|peak-p| = |p-q|)', Math.abs(lp - lq) < 1e-9);
    // determinism: standard snowflake identical each call
    const s1 = Koch.kochSnowflake(3, 200), s2 = Koch.kochSnowflake(3, 200);
    T('确定性：标准雪花同形', JSON.stringify(s1) === JSON.stringify(s2));
    // seed variant determinism
    const v1 = Koch.kochSnowflake(3, 200, '晨星'), v2 = Koch.kochSnowflake(3, 200, '晨星');
    T('变体确定性：同种子同形', JSON.stringify(v1) === JSON.stringify(v2));
    const v3 = Koch.kochSnowflake(3, 200, '别的');
    T('变体区分：异种子异形', JSON.stringify(v1) !== JSON.stringify(v3));
    // variant still closed & finite
    let finite = true; for (const p of v1) if (!isFinite(p.x) || !isFinite(p.y)) finite = false;
    T('变体数值稳定：全有限', finite);
    document.getElementById('selfcheck').innerHTML = out.join('<br>');
  };

  draw();
})();
</script>
</body>
</html>
